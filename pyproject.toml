[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-atlas"
version = "0.1.0"
description = "Turn a repository tree into a name-based index for coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Agentic Memory Foundation" }]
keywords = ["agents", "code-search", "rename", "refactoring"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "httpx>=0.27",
  "pathspec>=0.12",
  "rich>=13.7",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
repo-atlas = "repo_atlas.cli:app"

[project.urls]
Homepage = "https://github.com/Agentic-Memory-Foundation/repo-atlas"
Repository = "https://github.com/Agentic-Memory-Foundation/repo-atlas"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repo_atlas = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"bench/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=repo_atlas --cov-report=term-missing --cov-fail-under=85"
pythonpath = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["repo_atlas"]
omit = ["*/__main__.py"]
